$kind: http-request
name: Create Project - Long Description
method: POST
url: '{{baseUrl}}/api/projects'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Valid Name",
      "description": "",
      "status": "PLANNING"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400 (description exceeds 500 chars)", function () {
          pm.response.to.have.status(400);
      });
