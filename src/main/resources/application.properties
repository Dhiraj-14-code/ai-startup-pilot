spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/startuppilot
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# AI Startup Pilot - development configuration
jwt.secret=${JWT_SECRET}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}